<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    :root {
      --marca-profunda: #2a1663;
      --marca: #4a2c8a;
      --acento: #6c3fd8;
      --acento-claro: #a78bfa;
      --pista: #ece7fb;
      --fondo: #f6f4fc;
      --superficie: #ffffff;
      --texto: #1f1b2e;
      --texto-2: #5b5670;
      --borde: #e4dff3;
      --exito: #1f9d63;
      --seguir-1: #4a2c8a;
      --seguir-2: #7c5ce0;
      --seguir-3: #b9a6f0;
      --seguir-4: #ddd3f7;
      --seguir-5: #efeaf9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      -webkit-font-smoothing: antialiased;
    }
    .cabecera {
      background: linear-gradient(135deg, var(--marca-profunda), var(--acento));
      color: #fff;
      padding: 40px 20px 96px;
    }
    .contenedor { max-width: 1080px; margin: 0 auto; }
    .marca { font-weight: 800; letter-spacing: .3px; font-size: 18px; opacity: .95; display: flex; align-items: center; gap: 10px; }
    .marca .punto { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.18); display: grid; place-items: center; font-size: 16px; }
    h1 { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.15; margin: 22px 0 10px; max-width: 760px; }
    .subtitulo { font-size: 16px; opacity: .88; max-width: 680px; line-height: 1.5; margin: 0; }
    .base { margin-top: 18px; display: inline-flex; gap: 8px; align-items: center; background: rgba(255,255,255,.14); padding: 7px 14px; border-radius: 999px; font-size: 13px; }

    main { padding: 0 20px 48px; margin-top: -64px; }
    .destacados { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .tarjeta { background: var(--superficie); border-radius: 20px; box-shadow: 0 10px 30px rgba(42,22,99,.08); border: 1px solid var(--borde); }
    .destacado { padding: 26px 22px; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .anillo {
      --p: 0;
      width: 150px; height: 150px; border-radius: 50%;
      background: conic-gradient(var(--acento) calc(var(--p) * 1%), var(--pista) 0);
      display: grid; place-items: center; position: relative;
    }
    .anillo::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; background: var(--superficie); }
    .anillo span { position: relative; font-size: 38px; font-weight: 800; color: var(--marca); }
    .destacado h3 { margin: 18px 0 6px; font-size: 17px; line-height: 1.35; }
    .destacado p { margin: 0; font-size: 13px; color: var(--texto-2); line-height: 1.45; }

    h2 { font-size: 20px; margin: 40px 0 14px; display: flex; align-items: center; gap: 10px; }
    h2::before { content: ""; width: 6px; height: 22px; border-radius: 3px; background: var(--acento); }
    .grupos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .grupo { padding: 22px; }
    .grupo h3 { margin: 0 0 16px; font-size: 16px; color: var(--marca); }
    .fila { margin-bottom: 16px; }
    .fila:last-child { margin-bottom: 0; }
    .fila-texto { display: flex; align-items: baseline; gap: 12px; }
    .fila-pct { font-size: 24px; font-weight: 800; color: var(--marca); min-width: 64px; }
    .fila-titulo { font-size: 14.5px; line-height: 1.35; }
    .barra { height: 8px; border-radius: 99px; background: var(--pista); margin-top: 8px; overflow: hidden; }
    .barra div { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--acento), var(--acento-claro)); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
    .fila-detalle { font-size: 12px; color: var(--texto-2); margin-top: 5px; }

    .seguir { padding: 24px; }
    .seguir-barra { display: flex; height: 26px; border-radius: 10px; overflow: hidden; background: var(--pista); }
    .seguir-barra div { height: 100%; transition: width 1.1s ease; }
    .leyenda { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 16px; font-size: 14px; }
    .leyenda span { display: inline-flex; align-items: center; gap: 8px; }
    .leyenda i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
    .nps { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--borde); }
    .nps-valor { font-size: 34px; font-weight: 800; color: var(--exito); }
    .nps p { margin: 0; color: var(--texto-2); font-size: 14px; line-height: 1.5; max-width: 620px; }

    .metodo { font-size: 13px; color: var(--texto-2); line-height: 1.6; margin-top: 36px; padding: 18px 20px; border-radius: 16px; background: #efeaf9; }
    .vacio { text-align: center; padding: 56px 24px; }
    .vacio h3 { margin: 0 0 8px; }
    .vacio p { margin: 0; color: var(--texto-2); }

    @media (prefers-reduced-motion: reduce) {
      .barra div, .seguir-barra div { transition: none; }
    }
    @media (max-width: 820px) {
      .destacados, .grupos { grid-template-columns: 1fr; }
      .cabecera { padding: 28px 16px 88px; }
      main { padding: 0 16px 40px; }
    }
  </style>
</head>
<body>
  <header class="cabecera">
    <div class="contenedor">
      <div class="marca"><div class="punto">✓</div>EduPlanner</div>
      <h1>Lo que dicen los estudiantes después de usar EduPlanner</h1>
      <p class="subtitulo">Resultados de la prueba con estudiantes reales: cómo cambió su organización, sus notas, su motivación y su forma de estudiar.</p>
      <div class="base" id="base"></div>
    </div>
  </header>

  <main>
    <div class="contenedor" id="contenido"></div>
  </main>

  <script>
    const DATOS = <?!= datos ?>;

    function texto(etiqueta, clase, contenido) {
      const el = document.createElement(etiqueta);
      if (clase) el.className = clase;
      if (contenido !== undefined) el.textContent = contenido;
      return el;
    }
    // Con "reducir movimiento" activado en el sistema, los valores aparecen sin animación
    const SIN_ANIMACION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function pctTexto(pct) { return pct === null || pct === undefined ? '—' : pct + '%'; }

    // Cuenta de 0 al valor final
    function contar(el, final, sufijo) {
      if (final === null || final === undefined) { el.textContent = '—'; return; }
      if (SIN_ANIMACION) { el.textContent = final + sufijo; return; }
      let inicio = null; const duracion = 1100;
      function paso(t) {
        if (inicio === null) inicio = t;
        const avance = Math.max(0, Math.min(1, (t - inicio) / duracion));
        const suave = 1 - Math.pow(1 - avance, 3);
        el.textContent = Math.round(final * suave) + sufijo;
        if (avance < 1) requestAnimationFrame(paso);
      }
      requestAnimationFrame(paso);
    }

    const contenido = document.getElementById('contenido');
    const base = document.getElementById('base');

    if (!DATOS.total) {
      base.textContent = 'Aún no hay respuestas';
      const vacio = texto('div', 'tarjeta vacio');
      vacio.appendChild(texto('h3', '', 'Todavía no hay resultados'));
      vacio.appendChild(texto('p', '', 'Los porcentajes aparecerán aquí en cuanto lleguen las primeras encuestas desde la app.'));
      contenido.appendChild(vacio);
    } else {
      base.textContent = 'Basado en ' + DATOS.total + (DATOS.total === 1 ? ' respuesta' : ' respuestas') + ' · Actualizado el ' + DATOS.actualizado;

      // Tres cifras principales
      const destacados = texto('section', 'destacados');
      DATOS.destacados.forEach(function (d) {
        const tarjeta = texto('div', 'tarjeta destacado');
        const anillo = texto('div', 'anillo');
        const valor = texto('span');
        anillo.appendChild(valor);
        tarjeta.appendChild(anillo);
        tarjeta.appendChild(texto('h3', '', d.titulo.charAt(0).toUpperCase() + d.titulo.slice(1)));
        tarjeta.appendChild(texto('p', '', d.detalle));
        destacados.appendChild(tarjeta);
        requestAnimationFrame(function () {
          const final = d.pct || 0; let inicio = null;
          if (SIN_ANIMACION) { anillo.style.setProperty('--p', final); contar(valor, d.pct, '%'); return; }
          requestAnimationFrame(function animar(t) {
            if (inicio === null) inicio = t;
            const a = Math.max(0, Math.min(1, (t - inicio) / 1100));
            anillo.style.setProperty('--p', final * (1 - Math.pow(1 - a, 3)));
            if (a < 1) requestAnimationFrame(animar);
          });
          contar(valor, d.pct, '%');
        });
      });
      contenido.appendChild(destacados);

      // Indicadores por área
      contenido.appendChild(texto('h2', '', 'Porcentaje de estudiantes que…'));
      const grupos = texto('section', 'grupos');
      DATOS.grupos.forEach(function (g) {
        const tarjeta = texto('div', 'tarjeta grupo');
        tarjeta.appendChild(texto('h3', '', g.titulo));
        g.indicadores.forEach(function (ind) {
          const fila = texto('div', 'fila');
          const linea = texto('div', 'fila-texto');
          const pct = texto('div', 'fila-pct', '0%');
          linea.appendChild(pct);
          linea.appendChild(texto('div', 'fila-titulo', ind.titulo));
          fila.appendChild(linea);
          const barra = texto('div', 'barra'); const relleno = texto('div');
          barra.appendChild(relleno); fila.appendChild(barra);
          fila.appendChild(texto('div', 'fila-detalle', ind.detalle + (ind.n ? ' · ' + ind.n + ' respuestas' : '')));
          tarjeta.appendChild(fila);
          setTimeout(function () { relleno.style.width = (ind.pct || 0) + '%'; contar(pct, ind.pct, '%'); }, 150);
        });
        grupos.appendChild(tarjeta);
      });
      contenido.appendChild(grupos);

      // ¿La seguirán usando? y recomendación
      contenido.appendChild(texto('h2', '', '¿Seguirían usando EduPlanner?'));
      const seguir = texto('section', 'tarjeta seguir');
      const barra = texto('div', 'seguir-barra');
      const leyenda = texto('div', 'leyenda');
      const colores = ['var(--seguir-1)', 'var(--seguir-2)', 'var(--seguir-3)', 'var(--seguir-4)', 'var(--seguir-5)'];
      DATOS.seguir.forEach(function (s, i) {
        const tramo = texto('div'); tramo.style.background = colores[i]; tramo.style.width = '0%';
        tramo.title = s.opcion + ': ' + s.pct + '%';
        barra.appendChild(tramo);
        setTimeout(function () { tramo.style.width = s.pct + '%'; }, 150);
        const item = texto('span'); const muestra = texto('i'); muestra.style.background = colores[i];
        if (i >= 3) muestra.style.border = '1px solid #cfc5ee';
        item.appendChild(muestra);
        item.appendChild(document.createTextNode(s.opcion + ' · ' + s.pct + '%'));
        leyenda.appendChild(item);
      });
      seguir.appendChild(barra);
      seguir.appendChild(leyenda);
      if (DATOS.nps !== null) {
        const nps = texto('div', 'nps');
        nps.appendChild(texto('div', 'nps-valor', (DATOS.nps > 0 ? '+' : '') + DATOS.nps));
        nps.appendChild(texto('p', '', 'Índice de recomendación (NPS). El ' + pctTexto(DATOS.promotores) + ' recomendaría EduPlanner a un compañero con 9 o 10 sobre 10. El índice resta a ese porcentaje el de quienes darían 6 o menos; va de −100 a +100 y un valor positivo indica más promotores que detractores.'));
        seguir.appendChild(nps);
      }
      contenido.appendChild(seguir);

      contenido.appendChild(texto('div', 'metodo',
        'Cómo se calcula: cada porcentaje es la parte de los estudiantes que respondió de forma positiva a esa pregunta de la encuesta: ' +
        '4 o 5 en las preguntas de 1 a 5 ("de acuerdo" o "totalmente de acuerdo") y 7 o más en las de 1 a 10. ' +
        'Las respuestas son anónimas y los números se actualizan solos con cada encuesta nueva.'));
    }
  </script>
</body>
</html>
